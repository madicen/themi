<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Themi in Telegram</title>
  <desc id="desc">Three Telegram chats with Themi. One: the morning message, today's calendar with buttons for tasks, email, everything else and just one thing. Two: the house speaking up: the washer finished, the robot vacuum is stuck in the kitchen, and when to leave for the dentist. Three: plain words: groceries added, and a hard day answered with just one thing.</desc>
  <style>
    svg { --bg: #ffffff; --phone: #e7ebf0; --screen: #dfe7ee; --bar: #f7f9fb; --ink: #1d2330; --muted: #5f6878;
          --them: #ffffff; --me: #e1f7d0; --btn: #f3f6f9; --btn-ink: #2a7ab8; --accent: #2a9fd6; --edge: #d3d9e0; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --phone: #1f252d; --screen: #0f1720; --bar: #17212b; --ink: #e6e9ee; --muted: #9aa4b2;
            --them: #182533; --me: #2b5278; --btn: #1e2c3a; --btn-ink: #7cc4f0; --accent: #5bbbe8; --edge: #2b323c; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .phone { fill: var(--phone); }
    .screen { fill: var(--screen); }
    .bar { fill: var(--bar); }
    .them { fill: var(--them); }
    .me { fill: var(--me); }
    .btn { fill: var(--btn); stroke: var(--edge); stroke-width: 1; }
    .btn-t { font-size: 12.5px; font-weight: 600; fill: var(--btn-ink); }
    .msg { font-size: 13px; }
    .b { font-weight: 700; }
    .who { font-size: 14px; font-weight: 700; }
    .status { font-size: 11px; fill: var(--muted); }
    .cap { font-size: 15px; font-weight: 700; }
    .capsub { font-size: 12.5px; fill: var(--muted); }
    .dot { fill: var(--accent); }
    .time { font-size: 10px; fill: var(--muted); }
  </style>
  <defs>
    <clipPath id="scr"><rect x="12" y="12" width="272" height="476" rx="22"/></clipPath>
  </defs>

  <rect class="bg" width="960" height="600" rx="16"/>

  <!-- ============ Phone 1: the morning message ============ -->
  <text class="cap" x="34" y="40">One message in the morning</text>
  <text class="capsub" x="34" y="60">Today's calendar. The rest waits behind buttons.</text>
  <g transform="translate(22 82)">
    <rect class="phone" width="296" height="500" rx="32"/>
    <g clip-path="url(#scr)">
      <rect class="screen" x="12" y="12" width="272" height="476"/>
      <rect class="bar" x="12" y="12" width="272" height="56"/>
      <circle class="dot" cx="44" cy="40" r="15"/>
      <text x="44" y="45" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#fff">T</text>
      <text class="who" x="68" y="37">Themi</text>
      <text class="status" x="68" y="53">bot</text>

      <rect class="them" x="24" y="88" width="236" height="150" rx="14"/>
      <text class="msg b" x="38" y="112">Good morning, Erin.</text>
      <text class="msg" x="38" y="134">Sat 21 Nov:</text>
      <text class="msg" x="38" y="154">- 9-11 am: Farmers market</text>
      <text class="msg" x="38" y="174">- 11:30 am: Mia's swim lesson</text>
      <text class="msg" x="38" y="194">- 2-3 pm: Coffee with Priya</text>
      <text class="msg" x="38" y="214">- 6:30 pm: Dinner with the Parks</text>
      <text class="time" x="250" y="230" text-anchor="end">7:30</text>

      <rect class="btn" x="24" y="246" width="116" height="34" rx="9"/>
      <text class="btn-t" x="82" y="268" text-anchor="middle">Today's tasks</text>
      <rect class="btn" x="144" y="246" width="116" height="34" rx="9"/>
      <text class="btn-t" x="202" y="268" text-anchor="middle">Email</text>
      <rect class="btn" x="24" y="284" width="116" height="34" rx="9"/>
      <text class="btn-t" x="82" y="306" text-anchor="middle">Everything else</text>
      <rect class="btn" x="144" y="284" width="116" height="34" rx="9"/>
      <text class="btn-t" x="202" y="306" text-anchor="middle">Just one thing</text>

      <rect class="me" x="150" y="338" width="122" height="38" rx="14"/>
      <text class="msg" x="164" y="362">Just one thing</text>

      <rect class="them" x="24" y="388" width="236" height="78" rx="14"/>
      <text class="msg" x="38" y="412">One to start with: call the vet</text>
      <text class="msg" x="38" y="432">about Mochi's checkup. The rest</text>
      <text class="msg" x="38" y="452">can wait.</text>
    </g>
  </g>

  <!-- ============ Phone 2: the house speaks up ============ -->
  <text class="cap" x="354" y="40">The house speaks up</text>
  <text class="capsub" x="354" y="60">To whoever has room for it, at a good moment.</text>
  <g transform="translate(332 82)">
    <rect class="phone" width="296" height="500" rx="32"/>
    <g clip-path="url(#scr)">
      <rect class="screen" x="12" y="12" width="272" height="476"/>
      <rect class="bar" x="12" y="12" width="272" height="56"/>
      <circle class="dot" cx="44" cy="40" r="15"/>
      <text x="44" y="45" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#fff">T</text>
      <text class="who" x="68" y="37">Themi</text>
      <text class="status" x="68" y="53">bot</text>

      <rect class="them" x="24" y="84" width="240" height="60" rx="14"/>
      <text class="msg" x="38" y="108">The washer finished at 11:02 am.</text>
      <text class="msg" x="38" y="128">Into the dryer now, or later?</text>
      <rect class="btn" x="24" y="150" width="118" height="32" rx="9"/>
      <text class="btn-t" x="83" y="171" text-anchor="middle">Moved it</text>
      <rect class="btn" x="146" y="150" width="118" height="32" rx="9"/>
      <text class="btn-t" x="205" y="171" text-anchor="middle">Later</text>

      <rect class="them" x="24" y="196" width="240" height="80" rx="14"/>
      <text class="msg" x="38" y="220">The vacuum's stuck in the kitchen</text>
      <text class="msg" x="38" y="240">(it's trapped). Free it and pop it</text>
      <text class="msg" x="38" y="260">back on the dock?</text>
      <rect class="btn" x="24" y="282" width="118" height="32" rx="9"/>
      <text class="btn-t" x="83" y="303" text-anchor="middle">Done</text>
      <rect class="btn" x="146" y="282" width="118" height="32" rx="9"/>
      <text class="btn-t" x="205" y="303" text-anchor="middle">Later</text>

      <rect class="them" x="24" y="328" width="240" height="120" rx="14"/>
      <text class="msg b" x="38" y="352">Dentist at 2 pm:</text>
      <text class="msg" x="38" y="372">about 17 min with traffic.</text>
      <text class="msg" x="38" y="392">Leave around 1:43 pm; start</text>
      <text class="msg" x="38" y="412">getting ready around 1:28 pm.</text>
      <text class="time" x="254" y="440" text-anchor="end">12:58</text>
    </g>
  </g>

  <!-- ============ Phone 3: plain words ============ -->
  <text class="cap" x="664" y="40">Just say it</text>
  <text class="capsub" x="664" y="60">Plain words, voice notes or a photo.</text>
  <g transform="translate(642 82)">
    <rect class="phone" width="296" height="500" rx="32"/>
    <g clip-path="url(#scr)">
      <rect class="screen" x="12" y="12" width="272" height="476"/>
      <rect class="bar" x="12" y="12" width="272" height="56"/>
      <circle class="dot" cx="44" cy="40" r="15"/>
      <text x="44" y="45" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#fff">T</text>
      <text class="who" x="68" y="37">Themi</text>
      <text class="status" x="68" y="53">bot</text>

      <rect class="me" x="56" y="84" width="216" height="58" rx="14"/>
      <text class="msg" x="70" y="108">we're out of oat milk, and get</text>
      <text class="msg" x="70" y="128">thyme for Thursday</text>
      <rect class="them" x="24" y="152" width="220" height="38" rx="14"/>
      <text class="msg" x="38" y="176">Added both to Groceries.</text>

      <rect class="me" x="56" y="204" width="216" height="58" rx="14"/>
      <text class="msg" x="70" y="228">remind me to move the car</text>
      <text class="msg" x="70" y="248">at 7 tonight</text>
      <rect class="them" x="24" y="272" width="220" height="38" rx="14"/>
      <text class="msg" x="38" y="296">I'll remind you at 7 pm.</text>

      <rect class="me" x="56" y="324" width="216" height="38" rx="14"/>
      <text class="msg" x="70" y="348">what's on her plate today?</text>
      <rect class="them" x="24" y="372" width="240" height="98" rx="14"/>
      <text class="msg" x="38" y="396">Erin has four things on today,</text>
      <text class="msg" x="38" y="416">with a gap from 3 to 6. Her list:</text>
      <text class="msg" x="38" y="436">the vet, library books and flu</text>
      <text class="msg" x="38" y="456">shots. Want to take one?</text>
    </g>
  </g>
</svg>
