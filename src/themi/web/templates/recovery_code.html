{% extends "base.html" %}
{% block title %}Your recovery code · Themi{% endblock %}
{% block content %}
<section class="card">
  <h1>Your recovery code</h1>
  <p>If you can't use your passkey, this signs you in, once. Print it or keep it in a
  password manager.</p>
  <pre class="key">{{ code }}</pre>
  <p class="muted">This page shows it once.</p>
  <p><a class="button primary" href="/passkeys">Done</a></p>
</section>
{% endblock %}
