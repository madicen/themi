{% extends "base.html" %}
{% block title %}{{ title }} · Themi{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ title }}</h1>
  {% if body %}<p>{{ body }}</p>{% endif %}
  {% if offer_google and google_signin %}
  <p><a class="button primary" href="/auth/google">Sign in with Google</a></p>
  {% endif %}
  {% if offer_passkey %}
  <p><button data-passkey="sign-in">Sign in with a passkey</button>
    <a href="/recovery">Use a recovery code</a></p>
  <p id="passkey-said" class="muted" role="status"></p>
  <script src="{{ asset('passkeys.js') }}" defer></script>
  {% endif %}
</section>
{% endblock %}
