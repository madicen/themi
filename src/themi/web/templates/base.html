<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}Themi{% endblock %}</title>
  <link rel="stylesheet" href="/static/themi.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body{% if csrf %} hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% endif %}>
  <header class="top">
    <a class="brand" href="/">Themi</a>
    {% if member %}
    <nav>
      <a href="/">Home</a>
      <a href="/tasks">Tasks</a>
      <a href="/week">My week</a>
      <a href="/settings">My settings</a>
      <a href="/accounts">My accounts</a>
      <a href="/ai">My AI</a>
      <a href="/knowledge">Rules &amp; memory</a>
      <a href="/tiers">What Themi does alone</a>
      {% if member.is_admin %}<a href="/family">Family</a>{% endif %}
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% if flash %}<p class="flash" role="status">{{ flash }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
