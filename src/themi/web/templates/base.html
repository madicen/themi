<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}Themi{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset('themi.css') }}">
  <script src="{{ asset('htmx.min.js') }}" defer></script>
</head>
{% set path = request.url.path %}
<body class="{% if member %}signed-in{% endif %}"{% if csrf %} hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% endif %}>
  <header class="top">
    <a class="brand" href="/">Themi</a>
    {% if member %}
    <nav class="tabs" aria-label="Main">
      {% for item in menu_bar(member, path) %}
      <a href="{{ item.href }}" {% if item.current %}aria-current="page"{% endif %}>
        <svg {% if item.dots %}class="dots" {% endif %}viewBox="0 0 24 24" aria-hidden="true"><path d="{{ item.icon }}"/></svg>{{ item.label }}</a>
      {% endfor %}
    </nav>
    <details class="menu">
      <summary aria-label="Signed in as {{ member.name }}">{{ member.name }}</summary>
      <div class="menu-panel">
        <a href="/settings">My settings</a>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button class="link">Sign out</button>
        </form>
      </div>
    </details>
    {% endif %}
  </header>
  <main>
    {% if flash %}<p class="flash" role="status">{{ flash }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
