    <g class="scene-rain"><path d="M212 30 l -4 12 M236 46 l -4 12 M252 26 l -4 12 M282 34 l -4 12 M300 52 l -4 12 M318 28 l -4 12 M226 84 l -4 12 M290 88 l -4 12 M312 96 l -4 12"/></g>
