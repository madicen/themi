display_information:
  name: Themi
  description: A personal work assistant
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Themi
    always_online: true
  slash_commands:
    - command: /themi
      description: Run a Themi command
      usage_hint: pause | site
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - im:read
      - im:write
      - users:read
      - users:read.email
      - reactions:read
      - reactions:write
      - files:read
      - files:write
      - commands
    user:
      - users.profile:write
      - dnd:write
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
