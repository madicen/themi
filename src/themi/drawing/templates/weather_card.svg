<svg xmlns="http://www.w3.org/2000/svg" width="{{ width }}" height="{{ height }}" viewBox="0 0 {{ width }} {{ height }}" font-family="{{ font }}">
<rect width="{{ width }}" height="{{ height }}" fill="{{ c.bg }}"/>
<text x="{{ pad }}" y="44" font-size="22" font-weight="700" fill="{{ c.ink }}">{{ title }}</text>
<text x="{{ width - pad }}" y="44" text-anchor="end" font-size="12" fill="{{ c.muted }}">{{ head }}</text>
{% for row in rows %}
<rect x="{{ pad }}" y="{{ row.y|n }}" width="{{ width - 2 * pad }}" height="{{ row.height|n }}" rx="12" fill="none" stroke="{{ c.grid }}" stroke-width="1.25"/>
<text x="{{ pad + 16 }}" y="{{ (row.y + 30)|n }}" font-size="18" font-weight="700" fill="{{ c.ink }}">{{ row.name }}</text>
<text x="{{ pad + 16 }}" y="{{ (row.y + 50)|n }}" font-size="12" fill="{{ c.muted }}">{{ row.date }}</text>
{% if row.icon %}
<image href="{{ icon(row.icon) }}" x="{{ pad + 10 }}" y="{{ (row.y + 58)|n }}" width="56" height="56"/>
{% endif %}
{% if row.temps %}
<text x="{{ pad + 76 }}" y="{{ (row.y + 86)|n }}" font-size="22" font-weight="700" fill="{{ c.ink }}">{{ row.temps.high }}</text>
<text x="{{ pad + 76 }}" y="{{ (row.y + 104)|n }}" font-size="12" fill="{{ c.muted }}">low {{ row.temps.low }}</text>
{% endif %}
{% if row.line %}
<text x="{{ pad + 16 }}" y="{{ (row.y + 136)|n }}" font-size="13" fill="{{ c.ink }}">{{ row.line }}</text>
{% endif %}
{% if row.line_more %}
<text x="{{ pad + 16 }}" y="{{ (row.y + 153)|n }}" font-size="13" fill="{{ c.ink }}">{{ row.line_more }}</text>
{% endif %}
{% for tick in row.ticks %}
<line x1="{{ tick.x|n }}" x2="{{ tick.x|n }}" y1="{{ row.chart_top|n }}" y2="{{ row.chart_bottom|n }}" stroke="{{ c.grid }}" stroke-width="1"/>
<text x="{{ tick.x|n }}" y="{{ (row.chart_bottom + 16)|n }}" text-anchor="middle" font-size="10.5" fill="{{ c.muted }}">{{ tick.label }}</text>
{% endfor %}
<line x1="{{ x0|n }}" x2="{{ x1|n }}" y1="{{ row.chart_bottom|n }}" y2="{{ row.chart_bottom|n }}" stroke="{{ c.grid }}" stroke-width="1"/>
{% for bar in row.bars %}
<rect x="{{ bar.x|n }}" y="{{ bar.y|n }}" width="{{ bar.width|n }}" height="{{ bar.height|n }}" rx="2" fill="{{ c.rain }}" fill-opacity="0.45"/>
{% endfor %}
{% if row.points %}
<polyline points="{{ row.points }}" fill="none" stroke="{{ c.temp }}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
{% endif %}
{% for label in row.labels %}
<text x="{{ label.x|n }}" y="{{ label.y|n }}" text-anchor="middle" font-size="11" font-weight="700" fill="{{ c.temp }}">{{ label.text }}</text>
{% endfor %}
{% if row.now_x is not none %}
<line x1="{{ row.now_x|n }}" x2="{{ row.now_x|n }}" y1="{{ (row.chart_top - 4)|n }}" y2="{{ row.chart_bottom|n }}" stroke="{{ c.ink }}" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="{{ row.now_x|n }}" y="{{ (row.chart_top - 8)|n }}" text-anchor="middle" font-size="10.5" font-weight="700" fill="{{ c.ink }}">now</text>
{% endif %}
{% endfor %}
</svg>
