<svg xmlns="http://www.w3.org/2000/svg" width="{{ width }}" height="{{ height }}" viewBox="0 0 {{ width }} {{ height }}" font-family="{{ font }}">
<rect width="{{ width }}" height="{{ height }}" fill="{{ c.bg }}"/>
<text x="{{ pad }}" y="52" font-size="24" font-weight="700" fill="{{ c.ink }}">{{ title }}</text>
<text x="{{ pad }}" y="76" font-size="14" fill="{{ c.muted }}">{{ date }}</text>
{% for lane in lanes %}
{% if lane.name %}
<text x="{{ lane.x|n }}" y="102" font-size="16" font-weight="700" fill="{{ c.ink }}">{{ lane.name }}</text>
{% endif %}
{% for heading in lane.headings %}
<text x="{{ (lane.x + 2)|n }}" y="{{ heading.y|n }}" font-size="12" font-weight="700" fill="{{ c.muted }}">{{ heading.text }}</text>
{% endfor %}
{% if lane.more %}
<text x="{{ (lane.x + 4)|n }}" y="{{ lane.more_y|n }}" font-size="13" fill="{{ c.muted }}">{{ lane.more }}</text>
{% endif %}
{% if lane.empty %}
<text x="{{ (lane.x + 4)|n }}" y="134" font-size="14" fill="{{ c.muted }}">Nothing open</text>
{% endif %}
{% endfor %}
{% if shared %}
<text x="{{ pad }}" y="{{ shared.y|n }}" font-size="16" font-weight="700" fill="{{ c.ink }}">{{ shared.name }}</text>
{% if shared.more %}
<text x="{{ (pad + 4)|n }}" y="{{ shared.more_y|n }}" font-size="13" fill="{{ c.muted }}">{{ shared.more }}</text>
{% endif %}
{% endif %}
{% for card in cards %}
<rect x="{{ card.x|n }}" y="{{ card.y|n }}" width="{{ card.width|n }}" height="{{ card.height|n }}" rx="10" fill="{{ c.event }}" stroke="{{ c.alert_edge if card.important else c.event_edge }}" stroke-width="{{ 2 if card.important else 1.25 }}"/>
{% if card.emoji %}
<text x="{{ (card.x + 12)|n }}" y="{{ (card.y + 29)|n }}" font-size="18">{{ card.emoji }}</text>
{% endif %}
{% for line in card.lines %}
<text x="{{ card.text_x|n }}" y="{{ (card.y + 28 + loop.index0 * 18)|n }}" font-size="14" font-weight="700" fill="{{ c.ink }}">{{ line }}</text>
{% endfor %}
{% if card.note %}
<text x="{{ card.text_x|n }}" y="{{ (card.y + card.height - 12)|n }}" font-size="12" fill="{{ c.muted }}">{{ card.note }}</text>
{% endif %}
{% endfor %}
</svg>
