<svg xmlns="http://www.w3.org/2000/svg" width="{{ width }}" height="{{ height|n }}" viewBox="0 0 {{ width }} {{ height|n }}" font-family="{{ font }}">
<rect width="{{ width }}" height="{{ height|n }}" fill="{{ c.bg }}"/>
<text x="{{ pad }}" y="40" font-size="20" font-weight="700" fill="{{ c.ink }}">{{ title }}</text>
{% if empty %}
<text x="{{ pad }}" y="96" font-size="14" fill="{{ c.muted }}">{{ empty }}</text>
{% else %}
<text x="{{ bar_x }}" y="76" font-size="11.5" fill="{{ c.muted }}">Today, against the daily limit</text>
<text x="{{ width - pad }}" y="76" text-anchor="end" font-size="11.5" fill="{{ c.muted }}">This month</text>
{% endif %}
{% for group in groups %}
<text x="{{ pad }}" y="{{ group.y|n }}" font-size="11.5" font-weight="700" fill="{{ c.muted }}">{{ group.name }}</text>
<line x1="{{ pad }}" x2="{{ width - pad }}" y1="{{ (group.y + 8)|n }}" y2="{{ (group.y + 8)|n }}" stroke="{{ c.grid }}" stroke-width="1"/>
{% for row in group.rows %}
<text x="{{ pad }}" y="{{ (row.y + 20)|n }}" font-size="13" font-weight="700" fill="{{ c.ink }}">{{ row.label }}</text>
{% if row.bar %}
<rect x="{{ bar_x }}" y="{{ (row.y + 9)|n }}" width="{{ bar_w }}" height="12" rx="6" fill="{{ c.track }}"/>
{% if row.bar.width > 0 %}
<rect x="{{ bar_x }}" y="{{ (row.y + 9)|n }}" width="{{ row.bar.width|n }}" height="12" rx="6" fill="{{ row.bar.fill }}"/>
{% endif %}
{% if row.bar.pace is not none %}
<line x1="{{ row.bar.pace|n }}" x2="{{ row.bar.pace|n }}" y1="{{ (row.y + 4)|n }}" y2="{{ (row.y + 26)|n }}" stroke="{{ c.ink }}" stroke-width="1.25"/>
{% endif %}
{% if row.bar.heading is not none %}
<line x1="{{ row.bar.heading|n }}" x2="{{ row.bar.heading|n }}" y1="{{ (row.y + 4)|n }}" y2="{{ (row.y + 26)|n }}" stroke="{{ c.near }}" stroke-width="2" stroke-dasharray="3 2"/>
{% endif %}
{% else %}
<text x="{{ bar_x }}" y="{{ (row.y + 20)|n }}" font-size="11.5" fill="{{ c.muted }}">{{ row.none }}</text>
{% endif %}
<text x="{{ value_x }}" y="{{ (row.y + 20)|n }}" font-size="13" fill="{{ c.ink }}">{{ row.value }}</text>
<text x="{{ width - pad }}" y="{{ (row.y + 20)|n }}" text-anchor="end" font-size="12" fill="{{ c.muted }}">{{ row.month }}</text>
{% endfor %}
{% endfor %}
{% if spark %}
<text x="{{ pad }}" y="{{ spark.y|n }}" font-size="11.5" font-weight="700" fill="{{ c.muted }}">AI requests, last 30 days</text>
<line x1="{{ pad }}" x2="{{ width - pad }}" y1="{{ (spark.y + 8)|n }}" y2="{{ (spark.y + 8)|n }}" stroke="{{ c.grid }}" stroke-width="1"/>
<text x="{{ pad }}" y="{{ (spark.top + 36)|n }}" font-size="11.5" fill="{{ c.muted }}">Busiest day: {{ spark.peak }}</text>
<polyline points="{{ spark.points }}" fill="none" stroke="{{ c.event_edge }}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="{{ spark.dot.x|n }}" cy="{{ spark.dot.y|n }}" r="3" fill="{{ c.event_edge }}"/>
{% endif %}
</svg>
