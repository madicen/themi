<svg xmlns="http://www.w3.org/2000/svg" width="{{ width }}" height="{{ height }}" viewBox="0 0 {{ width }} {{ height }}" font-family="{{ font }}">
<rect width="{{ width }}" height="{{ height }}" fill="{{ c.bg }}"/>
<text x="{{ pad }}" y="48" font-size="22" font-weight="700" fill="{{ c.ink }}">{{ title }}</text>
<text x="{{ pad }}" y="72" font-size="13" fill="{{ c.muted }}">{{ words }}</text>
<line x1="{{ x0|n }}" x2="{{ x1|n }}" y1="{{ bottom|n }}" y2="{{ bottom|n }}" stroke="{{ c.grid }}" stroke-width="1.25"/>
{% if cap_y is not none %}
<line x1="{{ x0|n }}" x2="{{ x1|n }}" y1="{{ cap_y|n }}" y2="{{ cap_y|n }}" stroke="{{ c.muted }}" stroke-width="1" stroke-dasharray="4 4"/>
<text x="{{ x0|n }}" y="{{ (cap_y - 6)|n }}" font-size="11" fill="{{ c.muted }}">{{ cap }}</text>
{% endif %}
{% for bar in bars %}
<rect x="{{ bar.x|n }}" y="{{ bar.y|n }}" width="{{ bar.width|n }}" height="{{ bar.height|n }}" rx="5" fill="{{ c.event_edge if bar.now else c.event }}" stroke="{{ c.event_edge }}" stroke-width="1.25"/>
<text x="{{ bar.mid|n }}" y="{{ (bar.y - 7)|n }}" text-anchor="middle" font-size="12"{% if bar.now %} font-weight="700"{% endif %} fill="{{ c.ink }}">{{ bar.label }}</text>
<text x="{{ bar.mid|n }}" y="{{ (bottom + 18)|n }}" text-anchor="middle" font-size="11" fill="{{ c.muted }}">{{ bar.week }}</text>
{% if bar.now %}
<text x="{{ bar.mid|n }}" y="{{ (bottom + 34)|n }}" text-anchor="middle" font-size="11" font-weight="700" fill="{{ c.ink }}">this week</text>
{% endif %}
{% endfor %}
<text x="{{ pad }}" y="{{ (bottom + 56)|n }}" font-size="11" fill="{{ c.muted }}">{{ unit }}, a week at a time</text>
</svg>
