<!doctype html>
<html lang="en" class="wall-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>Wall · Themi</title>
  <meta name="theme-color" content="#e8ece6">
  <link rel="stylesheet" href="{{ asset('home/wall.css') }}">
  <script src="{{ asset('htmx.min.js') }}" defer></script>
  <script src="{{ asset('home/wall.js') }}" defer></script>
</head>
<body class="wall" hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
<main class="wall-screen">
  <header class="wall-top" id="wall-top" hx-get="/wall/part/top" hx-trigger="every 30s" hx-swap="innerHTML">
    {% include "wall/_top.html" %}
  </header>
  <div id="wall-note" hx-get="/wall/part/note" hx-trigger="every 30s" hx-swap="innerHTML">
    {% include "wall/_note.html" %}
  </div>
  <div id="wall-today" hx-get="/wall/part/today" hx-trigger="every 30s" hx-swap="innerHTML">
    {% include "wall/_today.html" %}
  </div>
  <div class="wall-columns" id="wall-columns" hx-get="/wall/part/columns" hx-trigger="every 30s" hx-swap="innerHTML">
    {% include "wall/_columns.html" %}
  </div>
  <div id="wall-week" hx-get="/wall/part/week" hx-trigger="every 600s" hx-swap="innerHTML">
    {% include "wall/_week.html" %}
  </div>
  <div class="wall-smalls" id="wall-smalls" hx-get="/wall/part/smalls" hx-trigger="every 600s" hx-swap="innerHTML">
    {% include "wall/_smalls.html" %}
  </div>
  <p class="wall-stale" id="wall-stale" role="status" hidden>Updated <span></span></p>
</main>
</body>
</html>
