{% extends "base.html" %}
{% block title %}Pair this frame · Themi{% endblock %}
{% block content %}
<section class="card">
  <h1>Pair this frame</h1>
  <p>On a phone, open <strong>Wall frames</strong> on Themi's website and press
  <strong>Pair a frame</strong>. Type the code it shows here.</p>
  {% if error %}<p class="flash" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/wall/pair">
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" required
      maxlength="7" autofocus></label>
    <label>Name this frame <input name="name" value="Wall" maxlength="60"></label>
    <button class="primary">Pair</button>
  </form>
</section>
{% endblock %}
