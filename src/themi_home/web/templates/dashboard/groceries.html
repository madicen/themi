<section>
  <h2>Grocery list</h2>
  <div class="rows">
  {% for item in groceries %}
  <form method="post" action="/groceries/{{ item.id }}/bought" class="row-plain">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <span>{{ item.name }}</span>
    <button class="small quiet">Got it</button>
  </form>
  {% else %}
  <p class="empty muted">The list is empty.</p>
  {% endfor %}
  </div>
</section>
