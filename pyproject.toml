[project]
name = "themi"
version = "0.1.0"
description = "Themi: a household assistant for one family, PDA-sensitive and energy-aware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "cryptography>=43",
    "anthropic>=2.3",
    "google-genai>=2.30",
    "openai>=3.30",
    "jsonschema>=4.23",
    "python-telegram-bot>=22.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
    "curl_cffi>=0.17",  # CatGenie: its cloud drops requests that don't look like a phone (CG1a)
    "python-dateutil>=2.9",  # chore schedules as RFC 5545 recurrence rules (F7)
]

[project.optional-dependencies]
# The OurGroceries mirror (unofficial library); without it the mirror just logs and waits.
ourgroceries = ["ourgroceries>=1.6"]
# Google Keep, for groceries said to Google Home (unofficial library); optional the same way.
keep = ["gkeepapi>=0.17"]
# LG ThinQ's pushes (30), over MQTT; without it the washer and dryer are read every 5 minutes.
thinq = ["paho-mqtt>=2.1"]
# The robot vacuum (V1), through the unofficial python-roborock library; without it the
# vacuum isn't offered.
roborock = ["python-roborock==7.15.1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "coverage[toml]>=7.6",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "types-python-dateutil>=2.9",
]

[project.scripts]
themi = "themi.cli:main"

[project.entry-points."themi.modules"]
# CR5a: every module, by its name, for themi.toml and the templates.
appliances = "themi.core.appliances:AppliancesModule"
body_double = "themi.core.body_double:BodyDoubleModule"
breaks = "themi.core.breaks:BreaksModule"
burnout = "themi.core.burnout:BurnoutModule"
business_hours = "themi.core.business_hours:BusinessHoursModule"
buying = "themi.core.buying:BuyingModule"
calendar = "themi.core.google_modules:CalendarModule"
calls = "themi.core.calls:CallsModule"
catgenie = "themi.core.connector_modules:CatGenieModule"
checkin_reviews = "themi.core.checkin_reviews:CheckinReviewsModule"
commands = "themi.core.commands:CommandsModule"
conversation_mode = "themi.core.conversation_mode:ConversationModeModule"
cookbook_save = "themi.core.cookbook_save:CookbookSaveModule"
cooking = "themi.core.cooking:CookingModule"
cooking_timers = "themi.core.cooking_timers:CookingTimersModule"
cozyla_chores = "themi.core.connector_modules:CozylaChoresModule"
cozyla_todos = "themi.core.connector_modules:CozylaTodosModule"
day_summary = "themi.core.day_summary:DaySummaryModule"
email_audit = "themi.core.connector_modules:EmailAuditModule"
feedback = "themi.core.feedback:FeedbackModule"
focus = "themi.core.focus:FocusModule"
follow_ups = "themi.core.follow_ups:FollowUpsModule"
gmail = "themi.core.google_modules:GmailModule"
google = "themi.core.google_modules:GoogleModule"
google_tasks = "themi.core.connector_modules:GoogleTasksModule"
groceries = "themi.core.groceries:GroceriesModule"
guided_steps = "themi.core.body_double_guided:GuidedStepsModule"
guides = "themi.core.guides:GuidesModule"
habits = "themi.core.habits:HabitsModule"
home_connect = "themi.core.connector_modules:HomeConnectModule"
journal = "themi.core.journal:JournalModule"
keep = "themi.core.connector_modules:KeepModule"
liaison = "themi.core.liaison:LiaisonModule"
lists = "themi.core.lists:ListsModule"
maintenance = "themi.core.maintenance:MaintenanceModule"
meals = "themi.core.meals:MealsModule"
memory = "themi.core.memory:MemoryModule"
mode_chooser = "themi.core.body_double_modes:ModeChooserModule"
music_offers = "themi.core.body_double_music:MusicOffersModule"
ourgroceries = "themi.core.connector_modules:OurGroceriesModule"
pantry = "themi.core.pantry:PantryModule"
reactions = "themi.core.reactions:ReactionsModule"
recipe_groceries = "themi.core.recipe_groceries:RecipeGroceriesModule"
recipe_ideas = "themi.core.recipe_ideas:RecipeIdeasModule"
recipes = "themi.core.recipes:RecipesModule"
reminders = "themi.core.reminders:RemindersModule"
roborock = "themi.core.connector_modules:RoborockModule"
routines = "themi.core.routines:RoutinesModule"
safeway = "themi.core.safeway:SafewayModule"
spending = "themi.core.spending:SpendingModule"
spotify = "themi.core.connector_modules:SpotifyModule"
step_pictures = "themi.core.step_images:StepPicturesModule"
taking = "themi.core.taking:TakingModule"
tasks = "themi.core.tasks:TasksModule"
thinq = "themi.core.connector_modules:ThinqModule"
travel = "themi.core.connector_modules:TravelModule"
tuya = "themi.core.connector_modules:TuyaModule"
web_recipes = "themi.core.web_recipes:WebRecipesModule"
web_search = "themi.core.web_search:WebSearchModule"
which_list = "themi.core.which_list:WhichListModule"
wrong_replies = "themi.core.wrong_replies:WrongRepliesModule"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
themi = [
    "storage/schema/*.sql",
    "templates/*.toml",
    "web/templates/*.html",
    "web/templates/*/*.html",
    "web/static/*",
    "web/static/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    # google-genai uses a typing alias Python 3.15 deprecates; not ours to fix.
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["themi"]
branch = true
# make cov runs the tests in parallel (xdist): measure each worker, then combine.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "RUF"]
# SIM905 rewrites """word list""".split() into a list literal that formats one word per line.
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["themi", "tools", "tests"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
