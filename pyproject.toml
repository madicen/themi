reminders = "themi.standard.reminders:RemindersModule"
roborock = "themi_home.home_modules:RoborockModule"
routines = "themi.standard.routines:RoutinesModule"
safeway = "themi_home.safeway:SafewayModule"
spending = "themi_home.spending:SpendingModule"
spotify = "themi_home.home_modules:SpotifyModule"
step_pictures = "themi_home.step_images:StepPicturesModule"
taking = "themi.standard.taking:TakingModule"
task_blocks = "themi_google.google_modules:TaskBlocksModule"
tasks = "themi.standard.tasks:TasksModule"
telegram = "themi.standard.telegram:TelegramModule"
thinq = "themi_home.home_modules:ThinqModule"
travel = "themi_google.connector_modules:TravelModule"
tuya = "themi_home.home_modules:TuyaModule"
urgent_senders = "themi_google.google_modules:UrgentSendersModule"
voice_notes = "themi.standard.capabilities:VoiceNotesModule"
web_chat = "themi.standard.web_chat:WebChatModule"
web_recipes = "themi_home.web_recipes:WebRecipesModule"
web_search = "themi.standard.web_search:WebSearchModule"
which_list = "themi_home.which_list:WhichListModule"
