burnout = "themi.standard.burnout:BurnoutModule"
business_hours = "themi.standard.business_hours:BusinessHoursModule"
buying = "themi_home.buying:BuyingModule"
calendar = "themi_google.google_modules:CalendarModule"
calendar_busy = "themi_google.google_modules:CalendarBusyModule"
calendar_copies = "themi_google.google_modules:CalendarCopiesModule"
calendar_twins = "themi_google.google_modules:CalendarTwinsModule"
calls = "themi_home.calls:CallsModule"
catgenie = "themi_home.home_modules:CatGenieModule"
checkin_reviews = "themi.standard.checkin_reviews:CheckinReviewsModule"
chore_chart = "themi_home.chore_chart:ChoreChartModule"
claude = "themi.standard.ai_providers:ClaudeModule"
cloudflare = "themi.standard.ai_providers:CloudflareModule"
commands = "themi.standard.commands:CommandsModule"
conversation_mode = "themi.standard.conversation_mode:ConversationModeModule"
cookbook_save = "themi_home.cookbook_save:CookbookSaveModule"
cooking = "themi_home.cooking:CookingModule"
cooking_timers = "themi_home.cooking_timers:CookingTimersModule"
cozyla_chores = "themi_cozyla.cozyla_modules:CozylaChoresModule"
cozyla_todos = "themi_cozyla.cozyla_modules:CozylaTodosModule"
day_summary = "themi.standard.day_summary:DaySummaryModule"
email_audit = "themi_google.connector_modules:EmailAuditModule"
email_forwarding = "themi_google.google_modules:EmailForwardingModule"
email_triage = "themi_google.google_modules:EmailTriageModule"
expected_emails = "themi_google.google_modules:ExpectedEmailsModule"
feedback = "themi.standard.feedback:FeedbackModule"
focus = "themi.standard.focus:FocusModule"
follow_ups = "themi.standard.follow_ups:FollowUpsModule"
gemini = "themi.standard.ai_providers:GeminiModule"
gmail = "themi_google.google_modules:GmailModule"
google = "themi_google.google_modules:GoogleModule"
google_tasks = "themi_google.connector_modules:GoogleTasksModule"
groceries = "themi_home.groceries:GroceriesModule"
guided_steps = "themi_home.body_double_guided:GuidedStepsModule"
guides = "themi.standard.guides:GuidesModule"
habits = "themi.standard.habits:HabitsModule"
home_connect = "themi_home.home_modules:HomeConnectModule"
image_generation = "themi.standard.capabilities:ImageGenerationModule"
journal = "themi.standard.journal:JournalModule"
keep = "themi_home.home_modules:KeepModule"
liaison = "themi_home.liaison:LiaisonModule"
lists = "themi.standard.lists:ListsModule"
maintenance = "themi_home.maintenance:MaintenanceModule"
meals = "themi_home.meals:MealsModule"
memory = "themi.standard.memory:MemoryModule"
mode_chooser = "themi_home.body_double_modes:ModeChooserModule"
music_offers = "themi_home.body_double_music:MusicOffersModule"
noise_digest = "themi_google.google_modules:NoiseDigestModule"
openai_compatible = "themi.standard.ai_providers:OpenAICompatibleModule"
ourgroceries = "themi_home.home_modules:OurGroceriesModule"
pantry = "themi_home.pantry:PantryModule"
