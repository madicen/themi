[project.entry-points."themi.templates"]
# CR10b2: each template, and the package its TOML file is in.
empty = "themi.templates"
family = "themi_home.templates"
work = "themi.templates"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
themi_home = [  # CR17b: its own pages' templates and static files
    "templates/*.toml",
    "setup/*.md",  # SP3b: the modules' setup guides
    "chore_chart_schema/*.sql",  # CR21a: the chore chart's own track
    "web/templates/*.html",
    "web/templates/*/*.html",
    "web/static/*",
    "web/static/*/*",
]
themi_google = ["web/templates/*.html", "web/templates/*/*.html", "setup/*.md"]
themi_cozyla = [
    "cozyla_chores_schema/*.sql",  # CR21c
    "cozyla_todos_schema/*.sql",
    "setup/*.md",  # SP3b: the modules' setup guides
]
themi = [
    "storage/schema/*.sql",
    "standard/setup/*.md",  # SP3a: the modules' setup guides
    "standard/web_chat_schema/*.sql",  # CR20b: the web chat's own track
    "templates/*.toml",
    "web/templates/*.html",
    "web/templates/*/*.html",
    "web/static/*",
    "web/static/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    # google-genai uses a typing alias Python 3.15 deprecates; not ours to fix.
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["themi", "themi_google", "themi_home"]
branch = true
# make cov runs the tests in parallel (xdist): measure each worker, then combine.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "RUF"]
# SIM905 rewrites """word list""".split() into a list literal that formats one word per line.
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["themi", "tools", "tests"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
