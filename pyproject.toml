[project]
name = "themi"
version = "0.1.0"
description = "Themi: a household assistant for one family, PDA-sensitive and energy-aware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "cryptography>=43",
    "anthropic>=2.3",
    "google-genai>=2.30",
    "openai>=3.30",
    "jsonschema>=4.23",
    "python-telegram-bot>=22.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
]

[project.optional-dependencies]
# The OurGroceries mirror (unofficial library); without it the mirror just logs and waits.
ourgroceries = ["ourgroceries>=1.6"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "coverage[toml]>=7.6",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[project.scripts]
themi = "themi.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
themi = ["storage/schema/*.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    # google-genai uses a typing alias Python 3.15 deprecates; not ours to fix.
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["themi"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "RUF"]
# SIM905 rewrites """word list""".split() into a list literal that formats one word per line.
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["themi", "tools", "tests"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
