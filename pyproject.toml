[project]
name = "themi"
version = "0.1.0"
description = "Themi: a household assistant for one family, PDA-sensitive and energy-aware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "cryptography>=43",
    "anthropic>=2.3",
    "google-genai>=2.30",
    "openai>=3.30",
    "jsonschema>=4.23",
    "python-telegram-bot>=22.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
    "curl_cffi>=0.17",  # CatGenie: its cloud drops requests that don't look like a phone (CG1a)
    "python-dateutil>=2.9",  # chore schedules as RFC 5545 recurrence rules (F7)
    "webauthn>=2.7,<3",  # SP7b: passkeys for admins without Telegram (Duo Labs' py_webauthn)
]

[project.optional-dependencies]
# The OurGroceries mirror (unofficial library); without it the mirror just logs and waits.
ourgroceries = ["ourgroceries>=1.6"]
# Google Keep, for groceries said to Google Home (unofficial library); optional the same way.
keep = ["gkeepapi>=0.17"]
# LG ThinQ's pushes (30), over MQTT; without it the washer and dryer are read every 5 minutes.
thinq = ["paho-mqtt>=2.1"]
# The robot vacuum (V1), through the unofficial python-roborock library; without it the
# vacuum isn't offered.
roborock = ["python-roborock==7.15.1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "coverage[toml]>=7.6",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "types-python-dateutil>=2.9",
]

[project.scripts]
themi = "themi.cli:main"

[project.entry-points."themi.modules"]
# CR5a: every module, by its name, for themi.toml and the templates.
appliances = "themi_home.appliances:AppliancesModule"
