<svg xmlns="http://www.w3.org/2000/svg" width="540" height="676" viewBox="0 0 540 676" font-family="Atkinson Hyperlegible">
<rect width="540" height="676" fill="#FBFAF7"/>
<text x="32" y="66" font-size="24" font-weight="700" fill="#1F2328">Pancakes</text>
<text x="32" y="90" font-size="13" fill="#6B6F76">Breakfast</text>
<line x1="32" x2="508" y1="126" y2="126" stroke="#E6E3DC" stroke-width="1"/>
<text x="32" y="146" font-size="16" font-weight="700" fill="#1F2328">Ingredients</text><circle cx="36" cy="164.5" r="2.5" fill="#4A88C7"/>
<text x="48" y="169" font-size="13.5" fill="#1F2328">1 ½ Cup (180 grams) white whole wheat flour</text><circle cx="36" cy="189.5" r="2.5" fill="#4A88C7"/>
<text x="48" y="194" font-size="13.5" fill="#1F2328">1 Cup (120 grams) all-purpose flour</text><circle cx="36" cy="214.5" r="2.5" fill="#4A88C7"/>
<text x="48" y="219" font-size="13.5" fill="#1F2328">1 Tbsp + 1 tsp baking powder (20g)</text><circle cx="36" cy="239.5" r="2.5" fill="#4A88C7"/>
<text x="48" y="244" font-size="13.5" fill="#1F2328">1 tsp cinnamon (optional)</text><circle cx="36" cy="264.5" r="2.5" fill="#4A88C7"/>
<text x="48" y="269" font-size="13.5" fill="#1F2328">½ tsp kosher salt</text><circle cx="36" cy="289.5" r="2.5" fill="#4A88C7"/>
<text x="48" y="294" font-size="13.5" fill="#1F2328">2 Cups unsweetened almond milk</text><circle cx="36" cy="314.5" r="2.5" fill="#4A88C7"/>
<text x="48" y="319" font-size="13.5" fill="#1F2328">¼ Cup (70g) unsweetened applesauce (or ¼ Cup (85g) pure maple syrup)</text><circle cx="36" cy="339.5" r="2.5" fill="#4A88C7"/>
<text x="48" y="344" font-size="13.5" fill="#1F2328">2 tsp pure vanilla extract</text><line x1="32" x2="508" y1="363" y2="363" stroke="#E6E3DC" stroke-width="1"/>
<text x="32" y="383" font-size="16" font-weight="700" fill="#1F2328">Steps</text><text x="32" y="406" font-size="13.5" font-weight="700" fill="#4A88C7">1.</text>
<text x="58" y="406" font-size="13.5" fill="#1F2328">If you’d like to keep the pancakes warm between batches, preheat the oven</text><text x="58" y="425" font-size="13.5" fill="#1F2328">to 200 °F.</text><text x="32" y="450" font-size="13.5" font-weight="700" fill="#4A88C7">2.</text>
<text x="58" y="450" font-size="13.5" fill="#1F2328">In the bottom of a large mixing bowl, whisk together the flours, baking</text><text x="58" y="469" font-size="13.5" fill="#1F2328">powder, cinnamon (if using), and salt. In a separate bowl, whisk together</text><text x="58" y="488" font-size="13.5" fill="#1F2328">the almond milk, applesauce and vanilla.</text><text x="32" y="513" font-size="13.5" font-weight="700" fill="#4A88C7">3.</text>
<text x="58" y="513" font-size="13.5" fill="#1F2328">Make a well in the center of the dry ingredients, then pour in the wet</text><text x="58" y="532" font-size="13.5" fill="#1F2328">ingredients. Stir the batter gently, just until the flour disappears.</text><text x="32" y="557" font-size="13.5" font-weight="700" fill="#4A88C7">4.</text>
<text x="58" y="557" font-size="13.5" fill="#1F2328">Heat a large nonstick skillet or griddle over medium-low heat.</text><text x="32" y="582" font-size="13.5" font-weight="700" fill="#4A88C7">5.</text>
<text x="58" y="582" font-size="13.5" fill="#1F2328">Drop the batter by ¼ Cupfuls onto the griddle. Cook on the first side until</text><text x="58" y="601" font-size="13.5" fill="#1F2328">small bubbles form on top and the edges look dry, about 2 to 3 minutes.</text><text x="58" y="620" font-size="13.5" fill="#1F2328">Gently flip the pancakes and cook on the other side until browned, about 1</text><text x="58" y="639" font-size="13.5" fill="#1F2328">to 2 minutes more.</text></svg>
