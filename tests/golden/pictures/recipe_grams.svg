<svg xmlns="http://www.w3.org/2000/svg" width="540" height="849" viewBox="0 0 540 849" font-family="Atkinson Hyperlegible">
<rect width="540" height="849" fill="#F8F5EE"/>
<text x="32" y="44" font-size="11" font-weight="700" letter-spacing="1.6" fill="#B5412B">BREAKFAST / MADICEN FAMILY RECIPE</text>
<text x="32" y="82" font-size="30" font-weight="700" fill="#22382B">Pancakes</text>
<rect x="32" y="102" width="476" height="2" fill="#B5412B"/>
<text x="32" y="148" font-size="18" font-weight="700" fill="#22382B">Ingredients</text><text x="32" y="180" font-size="13.5" fill="#2A2D2A"><tspan font-weight="700" fill="#22382B">1 ½ Cup (180 g)</tspan> white whole wheat</text>
<text x="32" y="199" font-size="13.5" fill="#2A2D2A">flour</text>
<text x="32" y="226" font-size="13.5" fill="#2A2D2A"><tspan font-weight="700" fill="#22382B">1 Cup (120 g)</tspan> all-purpose flour</text>
<text x="32" y="253" font-size="13.5" fill="#2A2D2A"><tspan font-weight="700" fill="#22382B">1 Tbsp</tspan> + 1 tsp (20 g) baking powder</text>
<text x="32" y="280" font-size="13.5" fill="#2A2D2A"><tspan font-weight="700" fill="#22382B">1 tsp</tspan> cinnamon (optional)</text>
<text x="280" y="180" font-size="13.5" fill="#2A2D2A"><tspan font-weight="700" fill="#22382B">½ tsp</tspan> kosher salt</text>
<text x="280" y="207" font-size="13.5" fill="#2A2D2A"><tspan font-weight="700" fill="#22382B">2 Cups</tspan> unsweetened almond milk</text>
<text x="280" y="234" font-size="13.5" fill="#2A2D2A"><tspan font-weight="700" fill="#22382B">¼ Cup (70 g)</tspan> unsweetened</text>
<text x="280" y="253" font-size="13.5" fill="#2A2D2A">applesauce (or ¼ Cup (85g) pure</text>
<text x="280" y="272" font-size="13.5" fill="#2A2D2A">maple syrup)</text>
<text x="280" y="299" font-size="13.5" fill="#2A2D2A"><tspan font-weight="700" fill="#22382B">2 tsp</tspan> pure vanilla extract</text>
<text x="32" y="348" font-size="18" font-weight="700" fill="#22382B">Let’s cook</text><text x="32" y="384" font-size="13" font-weight="700" fill="#B5412B">01</text>
<text x="68" y="384" font-size="14" font-weight="700" fill="#22382B">If you’d like</text>
<text x="68" y="403" font-size="13.5" fill="#2A2D2A">If you’d like to keep the pancakes warm between batches, preheat the</text><text x="68" y="422" font-size="13.5" fill="#2A2D2A">oven to 200 °F.</text><text x="32" y="457" font-size="13" font-weight="700" fill="#B5412B">02</text>
<text x="68" y="457" font-size="14" font-weight="700" fill="#22382B">In the bottom</text>
<text x="68" y="476" font-size="13.5" fill="#2A2D2A">In the bottom of a large mixing bowl, whisk together the flours, baking</text><text x="68" y="495" font-size="13.5" fill="#2A2D2A">powder, cinnamon (if using), and salt. In a separate bowl, whisk together</text><text x="68" y="514" font-size="13.5" fill="#2A2D2A">the almond milk, applesauce and vanilla.</text><text x="32" y="549" font-size="13" font-weight="700" fill="#B5412B">03</text>
<text x="68" y="549" font-size="14" font-weight="700" fill="#22382B">Make a well</text>
<text x="68" y="568" font-size="13.5" fill="#2A2D2A">Make a well in the center of the dry ingredients, then pour in the wet</text><text x="68" y="587" font-size="13.5" fill="#2A2D2A">ingredients. Stir the batter gently, just until the flour disappears.</text><text x="32" y="622" font-size="13" font-weight="700" fill="#B5412B">04</text>
<text x="68" y="622" font-size="14" font-weight="700" fill="#22382B">Heat a large</text>
<text x="68" y="641" font-size="13.5" fill="#2A2D2A">Heat a large nonstick skillet or griddle over medium-low heat.</text><text x="32" y="676" font-size="13" font-weight="700" fill="#B5412B">05</text>
<text x="68" y="676" font-size="14" font-weight="700" fill="#22382B">Drop the batter</text>
<text x="68" y="695" font-size="13.5" fill="#2A2D2A">Drop the batter by ¼ Cupfuls onto the griddle. Cook on the first side until</text><text x="68" y="714" font-size="13.5" fill="#2A2D2A">small bubbles form on top and the edges look dry, about 2 to 3 minutes.</text><text x="68" y="733" font-size="13.5" fill="#2A2D2A">Gently flip the pancakes and cook on the other side until browned, about 1</text><text x="68" y="752" font-size="13.5" fill="#2A2D2A">to 2 minutes more.</text><rect x="32" y="805" width="476" height="1" fill="#E3DDD1"/>
<text x="32" y="823" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#73766F" xml:space="preserve">PANCAKES  /  5 STEPS</text>
</svg>
