<svg xmlns="http://www.w3.org/2000/svg" width="540" height="849" viewBox="0 0 540 849" font-family="Atkinson Hyperlegible">
<rect width="540" height="849" fill="#181B19"/>
<text x="32" y="44" font-size="11" font-weight="700" letter-spacing="1.6" fill="#E58A6C">BREAKFAST / MADICEN FAMILY RECIPE</text>
<text x="32" y="82" font-size="30" font-weight="700" fill="#B5D3B0">Pancakes</text>
<rect x="32" y="102" width="476" height="2" fill="#E58A6C"/>
<text x="32" y="148" font-size="18" font-weight="700" fill="#B5D3B0">Ingredients</text><text x="32" y="180" font-size="13.5" fill="#E6E3DC"><tspan font-weight="700" fill="#B5D3B0">1 ½ Cup (180 grams)</tspan> white whole</text>
<text x="32" y="199" font-size="13.5" fill="#E6E3DC">wheat flour</text>
<text x="32" y="226" font-size="13.5" fill="#E6E3DC"><tspan font-weight="700" fill="#B5D3B0">1 Cup (120 grams)</tspan> all-purpose flour</text>
<text x="32" y="253" font-size="13.5" fill="#E6E3DC"><tspan font-weight="700" fill="#B5D3B0">1 Tbsp</tspan> + 1 tsp baking powder (20g)</text>
<text x="32" y="280" font-size="13.5" fill="#E6E3DC"><tspan font-weight="700" fill="#B5D3B0">1 tsp</tspan> cinnamon (optional)</text>
<text x="280" y="180" font-size="13.5" fill="#E6E3DC"><tspan font-weight="700" fill="#B5D3B0">½ tsp</tspan> kosher salt</text>
<text x="280" y="207" font-size="13.5" fill="#E6E3DC"><tspan font-weight="700" fill="#B5D3B0">2 Cups</tspan> unsweetened almond milk</text>
<text x="280" y="234" font-size="13.5" fill="#E6E3DC"><tspan font-weight="700" fill="#B5D3B0">¼ Cup (70g)</tspan> unsweetened</text>
<text x="280" y="253" font-size="13.5" fill="#E6E3DC">applesauce (or ¼ Cup (85g) pure</text>
<text x="280" y="272" font-size="13.5" fill="#E6E3DC">maple syrup)</text>
<text x="280" y="299" font-size="13.5" fill="#E6E3DC"><tspan font-weight="700" fill="#B5D3B0">2 tsp</tspan> pure vanilla extract</text>
<text x="32" y="348" font-size="18" font-weight="700" fill="#B5D3B0">Let’s cook</text><text x="32" y="384" font-size="13" font-weight="700" fill="#E58A6C">01</text>
<text x="68" y="384" font-size="14" font-weight="700" fill="#B5D3B0">Preheat the oven</text>
<text x="68" y="403" font-size="13.5" fill="#E6E3DC">If you’d like to keep the pancakes warm between batches, preheat the</text><text x="68" y="422" font-size="13.5" fill="#E6E3DC">oven to 200 °F.</text><text x="32" y="457" font-size="13" font-weight="700" fill="#E58A6C">02</text>
<text x="68" y="457" font-size="14" font-weight="700" fill="#B5D3B0">Whisk together</text>
<text x="68" y="476" font-size="13.5" fill="#E6E3DC">In the bottom of a large mixing bowl, whisk together the flours, baking</text><text x="68" y="495" font-size="13.5" fill="#E6E3DC">powder, cinnamon (if using), and salt. In a separate bowl, whisk together</text><text x="68" y="514" font-size="13.5" fill="#E6E3DC">the almond milk, applesauce and vanilla.</text><text x="32" y="549" font-size="13" font-weight="700" fill="#E58A6C">03</text>
<text x="68" y="549" font-size="14" font-weight="700" fill="#B5D3B0">Make a well</text>
<text x="68" y="568" font-size="13.5" fill="#E6E3DC">Make a well in the center of the dry ingredients, then pour in the wet</text><text x="68" y="587" font-size="13.5" fill="#E6E3DC">ingredients. Stir the batter gently, just until the flour disappears.</text><text x="32" y="622" font-size="13" font-weight="700" fill="#E58A6C">04</text>
<text x="68" y="622" font-size="14" font-weight="700" fill="#B5D3B0">Heat a large</text>
<text x="68" y="641" font-size="13.5" fill="#E6E3DC">Heat a large nonstick skillet or griddle over medium-low heat.</text><text x="32" y="676" font-size="13" font-weight="700" fill="#E58A6C">05</text>
<text x="68" y="676" font-size="14" font-weight="700" fill="#B5D3B0">Drop the batter</text>
<text x="68" y="695" font-size="13.5" fill="#E6E3DC">Drop the batter by ¼ Cupfuls onto the griddle. Cook on the first side until</text><text x="68" y="714" font-size="13.5" fill="#E6E3DC">small bubbles form on top and the edges look dry, about 2 to 3 minutes.</text><text x="68" y="733" font-size="13.5" fill="#E6E3DC">Gently flip the pancakes and cook on the other side until browned, about 1</text><text x="68" y="752" font-size="13.5" fill="#E6E3DC">to 2 minutes more.</text><rect x="32" y="805" width="476" height="1" fill="#2F3530"/>
<text x="32" y="823" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#9A9D96" xml:space="preserve">PANCAKES  /  5 STEPS</text>
</svg>
