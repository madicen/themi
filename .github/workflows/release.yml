name: Release

# Pushing a version tag (v1.2.3) builds the image and publishes it to GitHub's
# container registry as ghcr.io/madicen/themi:1.2.3, :1.2 and :latest, for PCs (amd64)
# and a Raspberry Pi (arm64; docs/RASPBERRY_PI.md). `tools/release.sh 1.2.3` tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test it first
        run: tools/smoke_container.sh themi:release
      - uses: docker/setup-qemu-action@v3   # builds the arm64 image on an amd64 runner
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: THEMI_BUILD_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
