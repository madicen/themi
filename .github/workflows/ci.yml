name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: make install PYTHON=python
      - name: Lint and type check
        run: make lint PYTHON=python
      - name: Unit, integration and scenario tests
        run: make test-all PYTHON=python

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and smoke-test it
        run: tools/smoke_container.sh themi:ci
