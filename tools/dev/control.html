<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themi control panel</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --line: #dde2e8; --text: #1c2430; --muted: #6b7684;
    --accent: #2f7dd1; --accent-text: #ffffff; --chip: #f1f4f8; --good: #2e7d4f; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151c; --panel: #18202a; --line: #2a3442; --text: #e4e9ef; --muted: #8d99a8;
      --accent: #4a96e6; --accent-text: #0b1118; --chip: #263241; --good: #6fcf97; --bad: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  body.embedded header { display: none; }
  main { padding: 12px 16px 40px; display: grid; gap: 10px; max-width: 760px; }
  body.embedded main { padding: 10px; }
  details {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px;
  }
  summary { cursor: pointer; padding: 10px 0; font-weight: 600; }
  .state {
    margin: 0 0 10px; padding: 8px 10px; background: var(--chip); border-radius: 8px;
    color: var(--muted); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  form { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 6px; }
  form h3 { margin: 0; font-size: 13px; }
  form .help { margin: 0; color: var(--muted); font-size: 12px; }
  .fields { display: flex; flex-wrap: wrap; gap: 6px 10px; }
  label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); flex: 1 1 120px; }
  label.wide { flex-basis: 100%; }
  input, select, textarea {
    font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0;
  }
  textarea { min-height: 60px; resize: vertical; }
  .go { display: flex; align-items: center; gap: 10px; }
  button {
    font: inherit; background: var(--accent); color: var(--accent-text); border: 0;
    border-radius: 8px; padding: 6px 14px; cursor: pointer; min-height: 32px;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .result { font-size: 12px; overflow-wrap: anywhere; }
  .result.ok { color: var(--good); }
  .result.bad { color: var(--bad); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Control panel</h1>
  <p>Make things happen outside the chat; Themi looks at once.</p>
</header>
<main id="sections"><p class="empty">Loading…</p></main>
<script>
if (new URLSearchParams(location.search).has("embedded")) document.body.classList.add("embedded");
let opened = [];
try { opened = JSON.parse(localStorage.getItem("themi-control-open") || "[]"); } catch {}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function input(field) {
  let node;
  if (field.kind === "select") {
    node = el("select");
    for (const option of field.options) node.append(new Option(option, option));
  } else if (field.kind === "textarea") {
    node = el("textarea");
  } else {
    node = el("input");
    node.type = field.kind === "number" ? "number" : field.kind;
    if (field.kind === "number") node.step = "any";
    if (field.kind === "date") node.title = "Leave empty for today";
  }
  node.name = field.name;
  node.value = field.default;
  node.required = field.required;
  if (!field.required && field.kind === "text") node.placeholder = "optional";
  return node;
}

function actionForm(section, action) {
  const form = el("form");
  form.append(el("h3", "", action.label));
  if (action.help) form.append(el("p", "help", action.help));
  const fields = el("div", "fields");
  for (const field of action.fields) {
    const label = el("label", field.kind === "textarea" ? "wide" : "", field.label);
    label.append(input(field));
    fields.append(label);
  }
  form.append(fields);
  const go = el("div", "go");
  const button = el("button", "", "Do it");
  const result = el("span", "result");
  go.append(button, result);
  form.append(go);
  form.onsubmit = async (event) => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(form).entries());
    button.disabled = true;
    result.className = "result";
    result.textContent = "Working… (Themi is looking)";
    try {
      const res = await fetch("/control/act", {
        method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({section: section.id, action: action.id, values}),
      });
      const body = await res.json();
      result.className = "result " + (body.ok ? "ok" : "bad");
      result.textContent = body.ok ? `Done: ${body.happened}` : body.error;
    } catch {
      result.className = "result bad";
      result.textContent = "Can't reach the simulator. Is make dev running?";
    }
    button.disabled = false;
    refreshState();
  };
  return form;
}

async function load() {
  const main = document.getElementById("sections");
  let schema;
  try {
    schema = await (await fetch("/control/schema")).json();
  } catch {
    main.replaceChildren(el("p", "empty", "Can't reach the simulator. Is make dev running?"));
    return;
  }
  main.replaceChildren();
  if (!schema.sections.length) {
    main.append(el("p", "empty", schema.error || "Nothing to control."));
    if (schema.retry) setTimeout(load, 1500);
    return;
  }
  if (schema.scenes && schema.scenes.length) main.append(scenesBox(schema.scenes));
  for (const section of schema.sections) {
    const box = el("details");
    box.dataset.id = section.id;
    box.open = opened.includes(section.id);
    box.ontoggle = () => {
      opened = [...document.querySelectorAll("details[open]")].map((d) => d.dataset.id);
      try { localStorage.setItem("themi-control-open", JSON.stringify(opened)); } catch {}
      if (box.open) refreshState();
    };
    box.append(el("summary", "", section.title));
    box.append(el("pre", "state", ""));
    for (const action of section.actions) box.append(actionForm(section, action));
    main.append(box);
  }
  refreshState();
}

function scenesBox(scenes) {
  // D5c: a named run of the panel's actions, with Themi's clock skipped between them.
  const box = el("details");
  box.dataset.id = "scenes";
  box.open = opened.includes("scenes");
  box.ontoggle = () => {
    opened = [...document.querySelectorAll("details[open]")].map((d) => d.dataset.id);
    try { localStorage.setItem("themi-control-open", JSON.stringify(opened)); } catch {}
  };
  box.append(el("summary", "", "Scenes"));
  const form = el("form");
  const pick = el("select");
  for (const scene of scenes) pick.append(new Option(scene.name, scene.name));
  const label = el("label", "wide", "Scene");
  label.append(pick);
  const about = el("p", "help");
  const steps = el("pre", "state");
  const show = () => {
    const scene = scenes.find((sc) => sc.name === pick.value);
    about.textContent = scene.about;
    steps.textContent = scene.steps.map((st, n) => `${n + 1}. ${st}`).join("\n");
  };
  pick.onchange = show;
  show();
  const go = el("div", "go");
  const button = el("button", "", "Run it");
  const result = el("span", "result");
  go.append(button, result);
  form.append(label, about, steps, go);
  form.onsubmit = async (event) => {
    event.preventDefault();
    button.disabled = true;
    result.className = "result";
    result.textContent = "Running… (each step shows in the chat)";
    try {
      const res = await fetch("/control/scene", {
        method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({name: pick.value}),
      });
      const body = await res.json();
      result.className = "result " + (body.ok ? "ok" : "bad");
      result.textContent = body.ok ? `Done: ${body.done.length} actions` : body.error;
    } catch {
      result.className = "result bad";
      result.textContent = "Can't reach the simulator. Is make dev running?";
    }
    button.disabled = false;
    refreshState();
  };
  box.append(form);
  return box;
}

async function refreshState() {
  const open = document.querySelectorAll("details[open]");
  if (!open.length) return;
  let state;
  try { state = await (await fetch("/control/state")).json(); } catch { return; }
  for (const box of open) {
    const lines = state[box.dataset.id];
    if (box.dataset.id === "scenes") continue;
    if (lines) box.querySelector(".state").textContent = lines.join("\n") || "—";
  }
}

load();
setInterval(refreshState, 3000);
</script>
</body>
</html>
