<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themi simulator</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --line: #dde2e8; --text: #1c2430; --muted: #6b7684;
    --me: #d9f2d0; --bot: #ffffff; --accent: #2f7dd1; --accent-text: #ffffff;
    --chip: #f1f4f8; --chip-on: #dcebfb; --notice: #fff6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151c; --panel: #18202a; --line: #2a3442; --text: #e4e9ef; --muted: #8d99a8;
      --me: #2b5130; --bot: #222c38; --accent: #4a96e6; --accent-text: #0b1118;
      --chip: #263241; --chip-on: #1f4366; --notice: #3b3418;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr; grid-template-columns: 200px 1fr;
  }
  header {
    grid-column: 1 / 3; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0 auto 0 0; }
  .clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  .clock b { color: var(--text); font-weight: 600; }
  button {
    font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #website, #energy { color: var(--accent); text-decoration: none; }
  #website:hover { text-decoration: underline; }
  nav { background: var(--panel); border-right: 1px solid var(--line); padding: 8px; }
  nav button {
    display: flex; width: 100%; justify-content: space-between; align-items: center;
    margin-bottom: 4px; padding: 10px 12px; background: transparent; border-color: transparent;
    text-align: left;
  }
  nav button.on { background: var(--chip-on); }
  nav .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  nav small { display: block; color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; flex-direction: column; max-width: min(560px, 80%); }
  .row.person { align-self: flex-end; align-items: flex-end; }
  .row.bot { align-self: flex-start; }
  .row.notice { align-self: center; max-width: 90%; }
  .bubble {
    padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
    box-shadow: 0 1px 1px rgb(0 0 0 / 8%); position: relative;
  }
  .person .bubble { background: var(--me); border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--bot); border-bottom-left-radius: 4px; }
  .notice .bubble { background: var(--notice); font-size: 13px; box-shadow: none; }
  .row.action { align-self: flex-end; color: var(--muted); font-size: 12px; font-style: italic; }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 6px 14px; border-radius: 8px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  #toast.on { opacity: 0.92; }
  dialog {
    width: min(760px, calc(100vw - 32px)); background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
  }
  dialog textarea { width: 100%; height: 50vh; height: 50dvh; font: 12px/1.4 ui-monospace, monospace; }
  dialog p { margin: 0 0 8px; }
  dialog div { display: flex; justify-content: flex-end; margin-top: 8px; }
  .edited { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .badge {
    position: absolute; bottom: -10px; left: -6px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 0 5px; font-size: 13px;
  }
  .keys { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .keys button { background: var(--chip-on); border-color: transparent; }
  .badge.mine {
    left: auto; right: -8px; bottom: -13px; padding: 1px 7px; font-size: 15px;
    border: 2px solid var(--accent); background: var(--chip-on);
  }
  .bubble.has-badge { margin-bottom: 13px; }
  .badge.pop { animation: pop 0.35s ease-out; }
  @keyframes pop { 0% { transform: scale(0.4); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .reacts { display: flex; gap: 4px; margin-top: 4px; }
  /* Faded until hovered, except the one in use (opacity on the buttons, so "on" stays solid). */
  .reacts button { padding: 0 6px; font-size: 13px; border-radius: 10px; opacity: 0.45; }
  .row:hover .reacts button, .reacts button.on { opacity: 1; }
  .reply-btn { opacity: 0.45; }
  .row:hover .reply-btn { opacity: 1; }
  .quote {
    font-size: 12px; color: var(--muted); border-left: 3px solid var(--accent);
    padding-left: 6px; margin-bottom: 4px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 360px;
  }
  #replying {
    display: none; align-items: center; gap: 8px; padding: 6px 16px 0; font-size: 13px;
    color: var(--muted);
  }
  #replying.on { display: flex; }
  #replying span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #replying b { color: var(--accent); }
  .reacts button.on {
    background: var(--accent); color: var(--accent-text); border-color: var(--accent);
    font-weight: 600;
  }
  #typing { color: var(--muted); font-style: italic; padding: 0 16px 6px; min-height: 22px; }
  form {
    display: flex; gap: 8px; padding: 10px 16px 14px; background: var(--panel);
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; height: 42px;
  }
  form button { background: var(--accent); color: var(--accent-text); border: 0; padding: 0 16px; }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; }
  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    header { grid-column: 1; }
    nav { display: flex; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); }
    nav button { margin: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Themi simulator</h1>
  <span class="clock">Themi's time: <b id="now">…</b> <span id="skipped"></span></span>
  <span>Skip ahead:</span>
  <button data-skip="15">15 min</button>
  <button data-skip="60">1 hour</button>
  <button data-skip="240">4 hours</button>
  <button data-skip="1440">1 day</button>
  <a id="website" target="_blank" rel="noopener">Website ↗</a>
  <a id="energy" target="_blank" rel="noopener" title="The Shadow Calendar's numbers (dev only)">Energy ↗</a>
  <button id="copy" title="Copy the conversations and Themi's log, to paste into Claude">Copy session</button>
  <button id="session" title="Start a new test session: later copies begin here">New session</button>
</header>
<div id="toast" role="status"></div>
<dialog id="report">
  <p>The browser blocked the clipboard. Select all and copy:</p>
  <textarea readonly></textarea>
  <div><button id="close-report">Close</button></div>
</dialog>
<nav id="people"></nav>
<main>
  <div id="log"></div>
  <div>
    <div id="typing"></div>
    <div id="replying"><b>Replying to:</b> <span id="replying-text"></span>
      <button type="button" id="cancel-reply" title="Don't reply">✕</button></div>
    <form id="composer">
      <textarea id="text" placeholder="Message Themi (Enter sends, Shift+Enter for a new line)"></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
</main>
<script>
const NOTES = {
  1001: "paired, admin",
  1002: "paired",
  1003: "not paired: try /start <code>",
};
let chat = 1001;
let lastVersion = -1;
let lastTyping = null;
let people = [];
const seen = {};  // chat id -> newest bot message seen there
const shownReactions = {};  // bot message id -> your reaction as last drawn
let replyTo = null;  // {id, text}: the message your next one replies to

function setReply(target) {
  replyTo = target;
  document.getElementById("replying").classList.toggle("on", !!target);
  document.getElementById("replying-text").textContent = target ? target.text.split("\n")[0] : "";
  if (target) document.getElementById("text").focus();
}

try { chat = Number(localStorage.getItem("themi-sim-chat")) || chat; } catch {}

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body),
  });
  if (!res.ok) alert((await res.json()).error || res.statusText);
  poll();
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderPeople(latest) {
  const nav = document.getElementById("people");
  nav.replaceChildren();
  for (const p of people) {
    const b = el("button", p.id === chat ? "on" : "");
    const label = el("span", "", p.name);
    label.append(el("small", "", NOTES[p.id] || ""));
    b.append(label);
    if (p.id !== chat && (latest[p.id] || 0) > (seen[p.id] || 0)) b.append(el("span", "dot"));
    b.onclick = () => {
      chat = p.id;
      try { localStorage.setItem("themi-sim-chat", String(chat)); } catch {}
      lastVersion = -1;
      setReply(null);
      poll();
    };
    nav.append(b);
  }
}

function renderEntries(entries) {
  const log = document.getElementById("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.replaceChildren();
  if (!entries.length) log.append(el("p", "empty", "No messages yet. Say hello."));
  const texts = {};  // message id -> its text, to say what a tap or reaction was on
  for (const e of entries) if (e.message_id) texts[e.message_id] = e.text;
  for (const e of entries) {
    const row = el("div", "row " + e.sender);
    if (e.sender === "action") {
      const match = e.text.match(/^(.*) on message (\d+)$/);
      const what = (match ? match[1] : e.text).replace("their reaction", "your reaction");
      const on = match && texts[match[2]];
      const quote = on ? ` on “${on.split("\n")[0].slice(0, 60)}${on.length > 60 ? "…" : ""}”` : "";
      row.textContent = "You " + what + quote;
      log.append(row);
      continue;
    }
    const bubble = el("div", "bubble");
    if (e.reply_to && texts[e.reply_to]) {
      bubble.append(el("div", "quote", texts[e.reply_to].split("\n")[0]));
    }
    bubble.append(document.createTextNode(e.text));
    if (e.edited) bubble.append(el("span", "edited", "edited"));
    if (e.bot_reactions.length) bubble.append(el("span", "badge", e.bot_reactions.join("")));
    if (e.sender === "bot" && e.reactions.length) {
      // Your reaction, on the message as Telegram shows it; it pops when it changes.
      const mine = e.reactions.join("");
      const badge = el("span", "badge mine", mine);
      badge.title = "Your reaction";
      if (shownReactions[e.message_id] !== undefined && shownReactions[e.message_id] !== mine) {
        badge.classList.add("pop");
      }
      bubble.classList.add("has-badge");
      bubble.append(badge);
    }
    if (e.sender === "bot") shownReactions[e.message_id] = e.reactions.join("");
    row.append(bubble);
    if (e.sender === "bot" && e.buttons.length) {
      const keys = el("div", "keys");
      for (const k of e.buttons) {
        const b = el("button", "", k.text);
        b.onclick = () => post("/sim/tap", {user_id: chat, message_id: e.message_id, data: k.data});
        keys.append(b);
      }
      row.append(keys);
    }
    if (e.sender === "bot") {
      const reacts = el("div", "reacts");
      for (const emoji of ["✅", "💤"]) {
        const on = e.reactions.includes(emoji);
        const b = el("button", on ? "on" : "", emoji);
        b.title = on ? `Remove your ${emoji}` : emoji === "✅" ? "React ✅ (approves an approval card)" : "React 💤 (snoozes an approval card)";
        b.onclick = () => {
          // Show it at once; the next poll confirms what Telegram recorded.
          for (const other of reacts.children) if (other !== b) other.classList.remove("on");
          b.classList.toggle("on");
          post("/sim/react", {user_id: chat, message_id: e.message_id, emoji});
        };
        reacts.append(b);
      }
      const reply = el("button", "reply-btn", "↩ Reply");
      reply.title = "Reply to this message (for example with /bug)";
      reply.onclick = () => setReply({id: e.message_id, text: e.text});
      reacts.append(reply);
      row.append(reacts);
    }
    log.append(row);
  }
  if (atBottom || lastVersion === -1) log.scrollTop = log.scrollHeight;
}

function renderClock(now, skipped) {
  const time = new Date(now);
  document.getElementById("now").textContent = time.toLocaleString(undefined, {
    weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit",
  });
  const h = Math.floor(skipped / 60), m = skipped % 60;
  const parts = [h && `${h}h`, m && `${m}m`].filter(Boolean).join(" ");
  document.getElementById("skipped").textContent = skipped ? `(skipped ahead ${parts})` : "";
}

async function poll() {
  let state;
  try {
    state = await (await fetch(`/sim/state?chat=${chat}`)).json();
  } catch {
    document.getElementById("typing").textContent = "Can't reach the simulator. Is make dev running?";
    return;
  }
  people = state.people;
  const site = document.getElementById("website");
  site.href = `/sim/website?person=${chat}`;
  document.getElementById("energy").href = `/sim/energy?person=${chat}`;
  site.title = `Open the website signed in as ${(people.find((p) => p.id === chat) || {}).name}`;
  seen[chat] = state.latest[chat] || 0;
  renderClock(state.now, state.skipped_minutes);
  renderPeople(state.latest);
  if (state.version !== lastVersion) {
    renderEntries(state.entries);
    lastVersion = state.version;
  }
  if (state.typing !== lastTyping) {
    document.getElementById("typing").textContent = state.typing ? "Themi is typing…" : "";
    lastTyping = state.typing;
  }
}

document.getElementById("composer").onsubmit = (event) => {
  event.preventDefault();
  const box = document.getElementById("text");
  const text = box.value.trim();
  if (!text) return;
  box.value = "";
  post("/sim/send", {user_id: chat, text, reply_to: replyTo ? replyTo.id : null});
  setReply(null);
};
document.getElementById("text").onkeydown = (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
};
for (const b of document.querySelectorAll("[data-skip]")) {
  b.onclick = () => post("/sim/skip", {minutes: Number(b.dataset.skip)});
}

let toastTimer;
function toast(text) {
  const box = document.getElementById("toast");
  box.textContent = text;
  box.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove("on"), 2500);
}

document.getElementById("copy").onclick = async () => {
  const text = await (await fetch("/sim/report")).text();
  try {
    await navigator.clipboard.writeText(text);
    toast(`Copied the session (${text.split("\n").length} lines)`);
  } catch {
    const dialog = document.getElementById("report");
    const area = dialog.querySelector("textarea");
    area.value = text;
    dialog.showModal();
    area.select();
  }
};
document.getElementById("cancel-reply").onclick = () => setReply(null);
document.getElementById("close-report").onclick = () => document.getElementById("report").close();
document.getElementById("session").onclick = async () => {
  await post("/sim/session", {});
  toast("New session started: copies begin here");
};

poll();
setInterval(poll, 700);
</script>
</body>
</html>
